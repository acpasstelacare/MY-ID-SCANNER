<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Card Scanner with Live Camera</title>
  <!-- Tesseract.js OCR Library -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; margin: 0; }
    .container { max-width: 500px; margin: auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 20px; }
    
    .camera-container { position: relative; width: 100%; height: 260px; background: #000; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video, canvas { width: 100%; height: 100%; object-fit: cover; }
    
    .card-overlay {
      position: absolute;
      width: 85%;
      height: 65%;
      border: 3px dashed #00ff88;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .card-overlay span { color: #fff; background: rgba(0,0,0,0.6); padding: 4px 10px; font-size: 12px; border-radius: 4px; margin-bottom: 8px; }

    .btn-group { margin-top: 15px; display: flex; gap: 10px; }
    button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
    .btn-capture { background-color: #007bff; color: white; }
    .btn-capture:hover { background-color: #0056b3; }
    .btn-reset { background-color: #6c757d; color: white; }
    
    #status { margin-top: 15px; text-align: center; font-weight: bold; color: #555; font-size: 14px; }
    
    #capturedImg { width: 100%; margin-top: 15px; border-radius: 8px; display: none; border: 1px solid #ddd; }
    .output-box { margin-top: 15px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; }
    .output-box h3 { margin-top: 0; font-size: 16px; color: #333; }
    textarea { width: 100%; height: 120px; border: 1px solid #ccc; border-radius: 6px; padding: 8px; resize: none; font-size: 13px; }
  </style>
</head>
<body>

<div class="container">
  <h2>ID કાર્ડ સ્કેનર</h2>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline></video>
    <div class="card-overlay">
      <span>કાર્ડ અહીં બોક્સની અંદર રાખો</span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <div class="btn-group">
    <button class="btn-capture" onclick="captureAndScan()">કાર્ડ સ્કેન કરો</button>
    <button class="btn-reset" onclick="resetCamera()">ફરી સ્કેન કરો</button>
  </div>

  <p id="status">કેમેરા પરમિશન આપીને કાર્ડ બોક્સમાં ગોઠવો...</p>

  <img id="capturedImg" alt="Captured Card">

  <div class="output-box">
    <h3>સ્કેન થયેલો ટેક્સ્ટ (Extracted Data):</h3>
    <textarea id="rawText" readonly placeholder="અહીં સ્કેન થયેલી વિગતો દેખાશે..."></textarea>
  </div>
</div>

<script>
  const video = document.getElementById('webcam');
  const canvas = document.getElementById('canvas');
  const capturedImg = document.getElementById('capturedImg');
  const status = document.getElementById('status');
  const rawText = document.getElementById('rawText');
  let stream = null;

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: "environment" } }
      });
      video.srcObject = stream;
    } catch (err) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
      } catch (e) {
        status.innerText = "કેમેરા ઓપન ન થઈ શક્યો: " + e.message;
      }
    }
  }

  function captureAndScan() {
    const context = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);

    const imageData = canvas.toDataURL('image/png');
    capturedImg.src = imageData;

    status.innerText = "સ્કેન થઈ રહ્યું છે... કૃપા કરીને રાહ જુઓ.";
    rawText.value = "";

    Tesseract.recognize(
      imageData,
      'eng',
      { logger: m => console.log(m) }
    ).then(({ data: { text } }) => {
      status.innerText = "સ્કેન સફળતાપૂર્વક પૂર્ણ થયું!";
      rawText.value = text;
    }).catch(err => {
      status.innerText = "સ્કેન કરવામાં ભૂલ આવી: " + err.message;
    });
  }

  function resetCamera() {
    rawText.value = "";
    status.innerText = "કાર્ડ બોક્સમાં ગોઠવો અને સ્કેન કરો...";
  }

  window.onload = startCamera;
</script>

</body>
</html>
